name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * 1,4' # Monday & Thursday at 12:00 UTC - well under Supabase's 7-day auto-pause window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase (prevents free-tier auto-pause, retries any missed sends)
        run: |
          set -a
          source .env
          set +a
          curl -sf -X POST "${VITE_SUPABASE_URL}/functions/v1/auto-send-blog-email" \
            -H "Authorization: Bearer ${VITE_SUPABASE_PUBLISHABLE_KEY}"
