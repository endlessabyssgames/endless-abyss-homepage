name: Deploy Endless Abyss Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify subscribers of new posts
        run: |
          sleep 20
          set -a
          source .env
          set +a
          curl -sf -X POST "${VITE_SUPABASE_URL}/functions/v1/auto-send-blog-email" \
            -H "Authorization: Bearer ${VITE_SUPABASE_PUBLISHABLE_KEY}"
